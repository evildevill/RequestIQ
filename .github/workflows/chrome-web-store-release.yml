name: Build Chrome Web Store ZIP and GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requestiq-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Validate, version, package, and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate manifest and extension entry points
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest.get("manifest_version") == 3, "Expected a Manifest V3 extension"
          version = manifest.get("version")
          parts = version.split(".") if isinstance(version, str) else []
          assert len(parts) == 3 and all(p.isdigit() for p in parts), "manifest version must be MAJOR.MINOR.PATCH"
          paths = [
              manifest.get("background", {}).get("service_worker"),
              manifest.get("action", {}).get("default_popup"),
              manifest.get("side_panel", {}).get("default_path"),
              *manifest.get("icons", {}).values(),
              *manifest.get("action", {}).get("default_icon", {}).values(),
          ]
          missing = sorted({p for p in paths if p and not Path(p).is_file()})
          if missing:
              raise SystemExit("Missing manifest files: " + ", ".join(missing))
          print(f"Manifest valid; current version: {version}")
          PY

      - name: Check JavaScript syntax
        run: |
          set -e
          find background popup shared sidepanel -type f \\( -name '*.js' -o -name '*.mjs' \\) -print0 |
            xargs -0 -r -n 1 node --check

      - name: Increment patch version and commit it to main
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          major, minor, patch = map(int, data["version"].split("."))
          data["version"] = f"{major}.{minor}.{patch + 1}"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(data["version"])
          PY
          )"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
          VERSION_COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${VERSION_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Build Chrome Web Store ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP="dist/RequestIQ-${VERSION}-chrome-web-store.zip"
          zip -r -X "$ZIP" manifest.json background images popup shared sidepanel
          unzip -t "$ZIP"
          python - "$ZIP" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
              assert "manifest.json" in names, "manifest.json must be at the ZIP root"
              assert not any(n.startswith("/") or "/../" in n for n in names), "Unsafe archive path"
          print("Chrome Web Store package structure verified")
          PY

      - name: Create GitHub Release and upload ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/RequestIQ-${VERSION}-chrome-web-store.zip" \\
            --repo "${GITHUB_REPOSITORY}" \\
            --target "$VERSION_COMMIT" \\
            --title "RequestIQ ${VERSION}" \\
            --generate-notes
